<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Learner Profiling</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --success: #27ae60; --danger: #e74c3c; --light: #ecf0f1; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; color: var(--primary); }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; padding: 20px; background: var(--light); border-radius: 8px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px 18px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; transition: 0.3s; }
        .btn-add { background: var(--secondary); }
        .status-indicator { font-size: 0.85em; font-style: italic; color: #666; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: var(--primary); color: white; }
        .flag-yes { color: var(--danger); font-weight: bold; }
        .loading-overlay { text-align: center; padding: 20px; font-weight: bold; }
    </style>
</head>
<body onload="loadFromCloud()">

<div class="container">
    <h2 style="text-align:center">BOSY Cloud Dashboard</h2>
    <div id="status" class="status-indicator">Connected to Cloud Database</div>
    
    <div class="form-group">
        <input type="text" id="name" placeholder="Learner Name">
        <select id="reading">
            <option value="Full Refresher">Full Refresher</option>
            <option value="Moderate Refresher">Moderate Refresher</option>
            <option value="Light Refresher">Light Refresher</option>
            <option value="Grade Level Ready">Grade Level Ready</option>
        </select>
        <select id="math">
            <option value="Low Numeracy">Low Numeracy</option>
            <option value="Average">Average</option>
            <option value="High Numeracy">High Numeracy</option>
        </select>
        <input type="text" id="notes" placeholder="Notes">
        <button class="btn-add" onclick="saveToCloud()">Add & Sync</button>
    </div>

    <div style="margin-bottom: 15px;">
        <button onclick="loadFromCloud()" style="background:#7f8c8d">🔄 Refresh Data</button>
        <button onclick="exportToExcel()" style="background:#1f7244">Download Excel</button>
    </div>

    <table id="learnerTable">
        <thead>
            <tr>
                <th>Learner Name</th>
                <th>Reading</th>
                <th>Math</th>
                <th>Needs Support?</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="5" class="loading-overlay">Syncing with Google Sheets...</td></tr>
        </tbody>
    </table>
</div>

<script>
    // PASTE YOUR GOOGLE WEB APP URL HERE
    const scriptURL = 'YOUR_COPIED_WEB_APP_URL_HERE';

    async function saveToCloud() {
        const name = document.getElementById('name').value;
        const reading = document.getElementById('reading').value;
        const math = document.getElementById('math').value;
        const notes = document.getElementById('notes').value;

        if (!name) return alert("Enter name.");
        
        const needsSupport = (reading.includes("Refresher") || math === "Low Numeracy") ? "Yes" : "No";
        const learner = { name, reading, math, needsSupport, notes };

        document.getElementById('status').innerText = "Saving to Google Sheets...";
        
        try {
            // Send data to Google Sheet
            await fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors', // Essential for Google Apps Script
                body: JSON.stringify(learner)
            });
            
            document.getElementById('status').innerText = "Sync Complete!";
            document.getElementById('name').value = '';
            document.getElementById('notes').value = '';
            
            // Reload table after a short delay to allow Google to process
            setTimeout(loadFromCloud, 1500);
        } catch (e) {
            document.getElementById('status').innerText = "Sync Error: " + e.message;
        }
    }

    async function loadFromCloud() {
        const tableBody = document.getElementById('tableBody');
        document.getElementById('status').innerText = "Fetching latest records...";

        try {
            const response = await fetch(scriptURL);
            const data = await response.json();
            
            tableBody.innerHTML = "";
            data.forEach(row => {
                const tr = tableBody.insertRow();
                tr.innerHTML = `
                    <td>${row[0]}</td>
                    <td>${row[1]}</td>
                    <td>${row[2]}</td>
                    <td class="${row[3] === 'Yes' ? 'flag-yes' : ''}">${row[3]}</td>
                    <td>${row[4]}</td>
                `;
            });
            document.getElementById('status').innerText = "Cloud Sync Active (" + data.length + " students)";
        } catch (e) {
            document.getElementById('status').innerText = "Offline Mode - Ready to load";
        }
    }

    function exportToExcel() {
        const wb = XLSX.utils.table_to_book(document.getElementById("learnerTable"), { sheet: "BOSY" });
        XLSX.writeFile(wb, "Cloud_BOSY_Export.xlsx");
    }
</script>

</body>
</html>
